<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Showcase</title>

    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header with the page title -->
    <header>
        <h1>Product Showcase</h1>
    </header>

    <!-- Main section with all 6 product cards -->
    <main>

        <!-- Card 1 -->
        <div class="card">
            <img src="https://placehold.co/270x180?text=Product+1" alt="Product 1">
            <h2>Wireless Headphones</h2>
            <p class="price">R499.99</p>
            <button>Add to Cart</button>
        </div>

        <!-- Card 2 -->
        <div class="card">
            <img src="https://placehold.co/270x180?text=Product+2" alt="Product 2">
            <h2>Smart Watch</h2>
            <p class="price">R899.99</p>
            <button>Add to Cart</button>
        </div>

        <!-- Card 3 -->
        <div class="card">
            <img src="https://placehold.co/270x180?text=Product+3" alt="Product 3">
            <h2>Bluetooth Speaker</h2>
            <p class="price">R349.99</p>
            <button>Add to Cart</button>
        </div>

        <!-- Card 4 -->
        <div class="card">
            <img src="https://placehold.co/270x180?text=Product+4" alt="Product 4">
            <h2>Laptop Backpack</h2>
            <p class="price">R299.99</p>
            <button>Add to Cart</button>
        </div>

        <!-- Card 5 -->
        <div class="card">
            <img src="https://placehold.co/270x180?text=Product+5" alt="Product 5">
            <h2>Gaming Mouse</h2>
            <p class="price">R249.99</p>
            <button>Add to Cart</button>
        </div>

        <!-- Card 6 -->
        <div class="card">
            <img src="https://placehold.co/270x180?text=Product+6" alt="Product 6">
            <h2>Phone Charger</h2>
            <p class="price">R129.99</p>
            <button>Add to Cart</button>
        </div>

    </main>

</body>
</html>
